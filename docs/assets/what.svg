<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="426.6" viewBox="0 0 1024 426.6" role="img" aria-labelledby="what-title what-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <title id="what-title">Grounder — Obsidian vault memory for Cursor and Claude Code</title>
  <desc id="what-desc">Cursor, Claude Code, and more agents on the left are connected by a two-way arrow to the vault on the right, labelled skills above and CLI below. The vault is a folder tree: 10-Projects, your-project, and inside it plans (updated across sessions), notes (always a new file), and logs (saved session summaries). Caption: any agent, one vault, only when you ask.</desc>

  <defs>
    <radialGradient id="glow" cx="512" cy="213.3" r="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF8F6"/>
      <stop offset="0.35" stop-color="#F2FAF9"/>
      <stop offset="0.62" stop-color="#F8FCFB"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>
    <symbol id="folder" viewBox="0 0 16 13">
      <path class="folder" d="M1.2 2.6q0-1.4 1.4-1.4h3.4l1.5 1.9h5.9q1.4 0 1.4 1.4v5.9q0 1.4-1.4 1.4H2.2q-1 0-1-1.4z"/>
    </symbol>
  </defs>

  <!-- 90% of 20 / 25, then gutter stretched to fill 1024 -->
  <style>
    .bg { fill: #FFFFFF; }
    .glow { fill: url(#glow); }
    .frame { fill: none; stroke: #DFEAE8; stroke-width: 1.35; }
    .card { fill: #FFFFFF; stroke: #BFD4D1; stroke-width: 1.35; }
    .card-dash { fill: none; stroke: #BFD4D1; stroke-width: 1.35; stroke-dasharray: 5.4 6.3; }
    .panel { fill: #FFFFFF; stroke: #BFD4D1; stroke-width: 1.35; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .kicker { fill: #0F766E; font-size: 22.5px; font-weight: 600; letter-spacing: 3.06px; }
    .name { fill: #05060C; font-size: 18px; font-weight: 600; }
    .more { fill: #6B7A79; font-size: 18px; font-weight: 500; }
    .caption { fill: #3E4B4A; font-size: 18px; font-weight: 500; }
    .file { fill: #05060C; font-size: 18px; }
    .note { fill: #6B7A79; font-size: 18px; font-weight: 500; }

    .arrow { fill: none; stroke: #3E4B4A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tree { fill: none; stroke: #A9C2BF; stroke-width: 1.26; }
    .folder { fill: none; stroke: #0F766E; stroke-width: 1.08; }
    .rule { fill: none; stroke: #E3EDEB; stroke-width: 0.9; }
  </style>

  <rect class="bg" width="1024" height="426.6" rx="18"/>
  <rect class="glow" width="1024" height="426.6" rx="18"/>
  <rect class="frame" x="0.675" y="0.675" width="1022.65" height="425.25" rx="17.55"/>

  <!-- agents -->
  <text class="kicker" x="198.3" y="52.2" text-anchor="middle">AGENTS</text>
  <rect class="card" x="36" y="75.6" width="327.6" height="64.8" rx="12.6"/>
  <text class="name mono" x="199.8" y="114.3" text-anchor="middle">Cursor</text>
  <rect class="card" x="36" y="158.4" width="327.6" height="64.8" rx="12.6"/>
  <text class="name mono" x="199.8" y="197.1" text-anchor="middle">Claude Code</text>
  <rect class="card-dash" x="36" y="241.2" width="327.6" height="64.8" rx="12.6"/>
  <text class="more" x="199.8" y="279.9" text-anchor="middle">+ more agents</text>

  <!-- two-way arrow -->
  <text class="kicker" x="510.5" y="167.4" text-anchor="middle">SKILLS</text>
  <path class="arrow" d="M380 190.8H644"/>
  <path class="arrow" d="M390.6 184.5L378 190.8L390.6 196.8"/>
  <path class="arrow" d="M633.4 184.5L646 190.8L633.4 196.8"/>
  <text class="kicker" x="510.5" y="230.4" text-anchor="middle">CLI</text>

  <!-- vault -->
  <text class="kicker" x="822.7" y="52.2" text-anchor="middle">VAULT</text>
  <rect class="panel" x="660.4" y="75.6" width="327.6" height="230.4" rx="14.4"/>

  <use href="#folder" x="680.2" y="101.7" width="14.4" height="11.7"/>
  <text class="file mono" x="703.6" y="111.6">10-Projects/</text>

  <path class="tree" d="M687.4 117v22.5h14.4"/>
  <use href="#folder" x="705.4" y="134.1" width="14.4" height="11.7"/>
  <text class="file mono" x="728.8" y="144">your-project/</text>

  <path class="tree" d="M712.6 151.2v94.5"/>
  <path class="tree" d="M712.6 177.3h14.4M712.6 211.5h14.4M712.6 245.7h14.4"/>

  <use href="#folder" x="730.6" y="171.9" width="14.4" height="11.7"/>
  <text class="file mono" x="754" y="181.8">plans/</text>

  <use href="#folder" x="730.6" y="206.1" width="14.4" height="11.7"/>
  <text class="file mono" x="754" y="216">notes/</text>

  <use href="#folder" x="730.6" y="240.3" width="14.4" height="11.7"/>
  <text class="file mono" x="754" y="250.2">logs/</text>

  <text class="note" x="824.2" y="284.4" text-anchor="middle">plain markdown &#8212; read, diff, delete</text>

  <path class="rule" d="M36 342h952"/>
  <text class="caption" x="512" y="390.6" text-anchor="middle">Any agent. One vault. Only when you ask.</text>
</svg>
