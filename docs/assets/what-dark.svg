<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="474" viewBox="0 0 1024 474" role="img" aria-labelledby="what-title what-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <title id="what-title">Grounder connects any agent to one markdown vault</title>
  <desc id="what-desc">Cursor, Claude Code, and more agents on the left are connected by a two-way arrow to the vault on the right, labelled slash commands above and CLI below. The vault is a folder tree: 10-Projects, your-project, and inside it plans, notes, and logs. Caption: any agent, one vault, only when you ask.</desc>

  <defs>
    <radialGradient id="glow" cx="512" cy="237" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#072724"/>
      <stop offset="0.35" stop-color="#061D1D"/>
      <stop offset="0.62" stop-color="#051417"/>
      <stop offset="1" stop-color="#05060C"/>
    </radialGradient>
    <symbol id="folder" viewBox="0 0 16 13">
      <path class="folder" d="M1.2 2.6q0-1.4 1.4-1.4h3.4l1.5 1.9h5.9q1.4 0 1.4 1.4v5.9q0 1.4-1.4 1.4H2.2q-1 0-1-1.4z"/>
    </symbol>
  </defs>

  <!-- type scale: 13 / 16 / 20 / 25 (1.25 ratio) -->
  <style>
    .bg { fill: #05060C; }
    .glow { fill: url(#glow); }
    .frame { fill: none; stroke: #13211F; stroke-width: 1.5; }
    .card { fill: #0A1317; stroke: #1D3A3B; stroke-width: 1.5; }
    .card-dash { fill: none; stroke: #1D3A3B; stroke-width: 1.5; stroke-dasharray: 6 7; }
    .panel { fill: #081014; stroke: #1D3A3B; stroke-width: 1.5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .kicker { fill: #3FCFC0; font-size: 25px; font-weight: 600; letter-spacing: 3.4px; }
    .name { fill: #F6F6F6; font-size: 20px; font-weight: 600; }
    .more { fill: #7C8B8B; font-size: 20px; font-weight: 500; }
    .caption { fill: #C4C4C4; font-size: 20px; font-weight: 500; }
    .file { fill: #F6F6F6; font-size: 16px; }
    .note { fill: #7C8B8B; font-size: 13px; }

    .arrow { fill: none; stroke: #C4C4C4; stroke-width: 2; stroke-linecap: round; }
    .head { fill: #C4C4C4; }
    .tree { fill: none; stroke: #2A4B4B; stroke-width: 1.4; }
    .folder { fill: none; stroke: #3FCFC0; stroke-width: 1.2; }
    .rule { fill: none; stroke: #16282A; stroke-width: 1; }
  </style>

  <rect class="bg" width="1024" height="474" rx="20"/>
  <rect class="glow" width="1024" height="474" rx="20"/>
  <rect class="frame" x="0.75" y="0.75" width="1022.5" height="472.5" rx="19.5"/>

  <!-- agents -->
  <text class="kicker" x="204.3" y="58" text-anchor="middle">AGENTS</text>
  <rect class="card" x="40" y="84" width="332" height="72" rx="14"/>
  <text class="name" x="206" y="127" text-anchor="middle">Cursor</text>
  <rect class="card" x="40" y="176" width="332" height="72" rx="14"/>
  <text class="name" x="206" y="219" text-anchor="middle">Claude Code</text>
  <rect class="card-dash" x="40" y="268" width="332" height="72" rx="14"/>
  <text class="more" x="206" y="311" text-anchor="middle">+ more agents</text>

  <!-- two-way arrow -->
  <text class="kicker" x="510.3" y="150" text-anchor="middle">SLASH</text>
  <text class="kicker" x="510.3" y="180" text-anchor="middle">COMMANDS</text>
  <path class="arrow" d="M402 212h220"/>
  <path class="head" d="M388 212l14-7v14z"/>
  <path class="head" d="M636 212l-14-7v14z"/>
  <text class="kicker" x="510.3" y="262" text-anchor="middle">CLI</text>

  <!-- vault -->
  <text class="kicker" x="816.3" y="58" text-anchor="middle">VAULT</text>
  <rect class="panel" x="652" y="84" width="332" height="256" rx="16"/>

  <use href="#folder" x="674" y="113" width="16" height="13"/>
  <text class="file mono" x="700" y="124">10-Projects/</text>

  <path class="tree" d="M682 130v25h16"/>
  <use href="#folder" x="702" y="149" width="16" height="13"/>
  <text class="file mono" x="728" y="160">your-project/</text>

  <path class="tree" d="M710 168v105"/>
  <path class="tree" d="M710 197h16M710 235h16M710 273h16"/>

  <use href="#folder" x="730" y="191" width="16" height="13"/>
  <text class="file mono" x="756" y="202">plans/</text>
  <text class="note" x="836" y="202">updated in place</text>

  <use href="#folder" x="730" y="229" width="16" height="13"/>
  <text class="file mono" x="756" y="240">notes/</text>
  <text class="note" x="836" y="240">one-off notes</text>

  <use href="#folder" x="730" y="267" width="16" height="13"/>
  <text class="file mono" x="756" y="278">logs/</text>
  <text class="note" x="836" y="278">session handoffs</text>

  <text class="note" x="674" y="316">plain markdown &#8212; read it, diff it, delete it</text>

  <path class="rule" d="M40 380h944"/>
  <text class="caption" x="512" y="434" text-anchor="middle">Any agent. One vault. Only when you ask.</text>
</svg>
