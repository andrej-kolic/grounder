name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "packages/vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"

concurrency:
  group: vscode-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package .vsix
        # vsce package only — no publish, no token. Catches manifest problems
        # (missing icon, bad fields) ahead of the actual publish workflow.
        run: pnpm --filter grounder-vscode-extension package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
