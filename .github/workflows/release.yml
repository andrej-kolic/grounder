name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm new enough for OIDC; still bump npm below.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assert tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('packages/grounder/package.json','utf8')).version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match packages/grounder version ${version}"
            exit 1
          fi

      - name: Check
        run: pnpm check

      - name: Publish to npm
        # OIDC only — do not set NODE_AUTH_TOKEN (empty token breaks trusted publishing).
        run: pnpm --filter grounder publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
